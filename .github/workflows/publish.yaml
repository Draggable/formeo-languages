name: Publish

on:
  push:
    branches:
      - master

jobs:
  build:
    env:
      CI: true
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # No dependency cache: this job holds publish tokens, and a cache written by
          # another workflow run could otherwise inject code into the release
          package-manager-cache: false
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      # semantic-release builds in its prepare step, after bumping the version,
      # so the bundle banner and the release assets carry the new version
      - name: Publish
        env:
          CI: true
        if: success()
        run: npx semantic-release
      # Rebuild for Pages, which deploys even when there's nothing to release
      - name: Build
        if: success()
        run: npm run build
      - name: Deploy - https://draggable.github.io/formeo-languages/
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./dist
