name: Translate

# Machine-translates new en-US strings into every other locale and opens a PR
# for review. Existing translations are never overwritten (see tools/translate.js).
on:
  push:
    branches:
      - master
    paths:
      - src/lang/en-US.lang
  workflow_dispatch:
    inputs:
      locales:
        description: Comma-separated target locales (blank for all)
        required: false
        default: ''
      fix_placeholders:
        description: Re-translate existing strings with broken {placeholders}
        type: boolean
        default: false

concurrency:
  group: translate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  translate:
    # Forks don't have the credentials secret
    if: github.repository == 'Draggable/formeo-languages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # No dependency cache: this job holds the Google key and a PAT (see publish.yaml)
          package-manager-cache: false
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      # Sets GOOGLE_APPLICATION_CREDENTIALS and GOOGLE_CLOUD_PROJECT for tools/translate.js.
      # GOOGLE_CREDENTIALS is a service account key JSON with the Cloud Translation API User role.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
      - name: Translate
        env:
          LOCALES: ${{ inputs.locales }}
          FIX_PLACEHOLDERS: ${{ inputs.fix_placeholders && 'true' || '' }}
        run: npm run translate -- en-US "$LOCALES" ${FIX_PLACEHOLDERS:+--fix-placeholders}
      # A PAT (rather than GITHUB_TOKEN) is used so the PR triggers the Pull Request workflow.
      # add-paths also keeps the credentials file the auth step writes out of the commit.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GH_TOKEN }}
          branch: translations/machine
          delete-branch: true
          add-paths: |
            src/lang
            src/js/index.js
          commit-message: 'fix(lang): add machine translations'
          title: 'fix(lang): add machine translations'
          body: |
            Machine translations generated by the [Translate workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            Only strings that were missing (or had broken placeholders, if requested) were translated.
            Native speakers are welcome to refine them with suggestions on this PR or in a follow-up.
